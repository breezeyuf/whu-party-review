name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, 'fix/security-hardening']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codex_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: party_review_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_test -d party_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codex_test:ci-only-password@127.0.0.1:5432/party_review_ci
      TEST_DATABASE_URL: postgresql+psycopg://codex_test:ci-only-password@127.0.0.1:5432/postgres
      APP_SECRET_KEY: ci-only-app-key-never-used-outside-tests
      ADMIN_PASSWORD: CiOnlyAdminPassword9!
      WORKER_ENABLED: '0'
      DEMO_LOGIN_HINT: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      STORAGE_DIR: ${{ runner.temp }}/party-review-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend and PostgreSQL regressions
        run: python -m pytest backend/tests -q --strict-markers --junitxml=backend-results.xml
      - name: Require database tests to run
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('backend-results.xml').getroot().iter('testsuite')
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          if skipped:
              raise SystemExit(f'CI must not skip database regressions: {skipped} skipped')
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build

  desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest desktop/tests -q
